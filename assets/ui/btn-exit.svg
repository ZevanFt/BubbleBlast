<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="exitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78909c"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </linearGradient>
    <filter id="exitShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 背景圆 -->
  <circle cx="20" cy="20" r="18" fill="url(#exitGrad)" filter="url(#exitShadow)"/>
  <!-- X 标记 -->
  <line x1="14" y1="14" x2="26" y2="26" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="26" y1="14" x2="14" y2="26" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <!-- 外圈 -->
  <circle cx="20" cy="20" r="18" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>
