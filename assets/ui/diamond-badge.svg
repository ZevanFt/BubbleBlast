<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="diamondGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <filter id="diamondGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 钻石 -->
  <polygon points="20,3 37,20 20,37 3,20" fill="url(#diamondGrad)" filter="url(#diamondGlow)"/>
  <!-- 内层 -->
  <polygon points="20,8 29,20 20,32 11,20" fill="rgba(255,255,255,0.2)"/>
  <!-- 高光 -->
  <polygon points="20,6 24,16 20,22 16,16" fill="rgba(255,255,255,0.5)"/>
  <!-- 边框 -->
  <polygon points="20,3 37,20 20,37 3,20" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
</svg>
