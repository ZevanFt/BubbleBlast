<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="timerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd23d"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <filter id="timerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 外圈 -->
  <circle cx="24" cy="24" r="20" fill="url(#timerGrad)" filter="url(#timerShadow)"/>
  <!-- 内部 -->
  <circle cx="24" cy="24" r="16" fill="#20233a"/>
  <!-- 时钟刻度 -->
  <line x1="24" y1="6" x2="24" y2="10" stroke="#ffe066" stroke-width="2"/>
  <line x1="24" y1="38" x2="24" y2="42" stroke="#ffe066" stroke-width="2"/>
  <line x1="6" y1="24" x2="10" y2="24" stroke="#ffe066" stroke-width="2"/>
  <line x1="38" y1="24" x2="42" y2="24" stroke="#ffe066" stroke-width="2"/>
  <!-- 时针 -->
  <line x1="24" y1="24" x2="19" y2="18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <!-- 分针 -->
  <line x1="24" y1="24" x2="30" y2="20" stroke="#ffe066" stroke-width="2" stroke-linecap="round"/>
  <!-- 中心 -->
  <circle cx="24" cy="24" r="3" fill="#ffd23d"/>
</svg>
