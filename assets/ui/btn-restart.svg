<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="restartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e05b5b"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <filter id="restartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 背景圆 -->
  <circle cx="20" cy="20" r="18" fill="url(#restartGrad)" filter="url(#restartShadow)"/>
  <!-- 循环箭头 -->
  <path d="M28,12 A12,12 0 1,0 28,28" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M28,22 L32,28 L24,28" fill="#fff" opacity="0.8"/>
  <!-- 外圈 -->
  <circle cx="20" cy="20" r="18" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>
