<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#9e9e9e"/>
    </linearGradient>
    <filter id="keyShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 键帽主体 -->
  <rect x="5" y="8" width="30" height="24" rx="5" fill="url(#keyGrad)" filter="url(#keyShadow)"/>
  <!-- 键帽高光 -->
  <rect x="7" y="9" width="26" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
  <!-- 字母 -->
  <text x="20" y="24" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="13" font-weight="bold" fill="#333">E</text>
  <!-- 底部阴影线 -->
  <line x1="8" y1="30" x2="32" y2="30" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
</svg>
