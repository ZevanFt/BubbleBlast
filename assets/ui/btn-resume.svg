<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="resumeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fa65b"/>
      <stop offset="100%" stop-color="#2d8a3e"/>
    </linearGradient>
    <filter id="resumeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 背景圆 -->
  <circle cx="20" cy="20" r="18" fill="url(#resumeGrad)" filter="url(#resumeShadow)"/>
  <!-- 播放三角 -->
  <polygon points="15,10 15,30 28,20" fill="#fff" opacity="0.9"/>
  <!-- 外圈光 -->
  <circle cx="20" cy="20" r="18" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>
