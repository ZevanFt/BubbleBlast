<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="settingsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#607d8b"/>
      <stop offset="100%" stop-color="#455a64"/>
    </linearGradient>
    <filter id="settingsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 背景圆 -->
  <circle cx="20" cy="20" r="18" fill="url(#settingsGrad)" filter="url(#settingsShadow)"/>
  <!-- 设置齿轮 -->
  <circle cx="20" cy="20" r="8" fill="none" stroke="#fff" stroke-width="2" opacity="0.7"/>
  <circle cx="20" cy="20" r="3" fill="#fff" opacity="0.8"/>
  <!-- 齿轮齿 -->
  <rect x="19" y="4" width="2" height="4" rx="1" fill="#fff" opacity="0.6"/>
  <rect x="19" y="32" width="2" height="4" rx="1" fill="#fff" opacity="0.6"/>
  <rect x="4" y="19" width="4" height="2" rx="1" fill="#fff" opacity="0.6"/>
  <rect x="32" y="19" width="4" height="2" rx="1" fill="#fff" opacity="0.6"/>
</svg>
