<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 20" width="120" height="20">
  <defs>
    <linearGradient id="energyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="energyFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#76ff03"/>
    </linearGradient>
    <filter id="energyGlow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect x="0" y="0" width="120" height="20" rx="10" fill="url(#energyBg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- 能量条 -->
  <rect x="2" y="2" width="80" height="16" rx="8" fill="url(#energyFill)" filter="url(#energyGlow)"/>
  <!-- 闪电图标 -->
  <polygon points="24,4 28,4 32,14 26,14 30,20 22,10 28,10" fill="#fff" opacity="0.9"/>
  <!-- 文字 -->
  <text x="96" y="13" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="9" font-weight="bold" fill="#00e676">50</text>
</svg>
