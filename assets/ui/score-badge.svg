<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="scoreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <filter id="scoreShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#scoreGrad)" filter="url(#scoreShadow)"/>
  <!-- 边框 -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="none" stroke="#ffd23d" stroke-width="1.5" opacity="0.6"/>
  <!-- 星星图案 -->
  <polygon points="20,6 22,14 30,14 23,20 25,28 20,23 15,28 17,20 10,14 18,14" fill="#fff" opacity="0.9"/>
  <!-- 数字 -->
  <text x="20" y="34" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="14" font-weight="bold" fill="#fff">99</text>
</svg>
