<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d0"/>
      <stop offset="60%" stop-color="#ffd23d"/>
      <stop offset="100%" stop-color="#ffd23d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 外光晕 -->
  <circle cx="20" cy="20" r="16" fill="url(#sparkleGlow)">
    <animate attributeName="r" values="10;18;10" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="0.6s" repeatCount="indefinite"/>
  </circle>
  <!-- 星形 -->
  <polygon points="20,8 23,16 32,16 25,21 27,30 20,24 13,30 15,21 8,16 17,16" fill="#fff8d0" opacity="0.9">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="0.6s" repeatCount="indefinite"/>
  </polygon>
  <!-- 中心点 -->
  <circle cx="20" cy="20" r="3" fill="#fff">
    <animate attributeName="r" values="2;4;2" dur="0.6s" repeatCount="indefinite"/>
  </circle>
</svg>
