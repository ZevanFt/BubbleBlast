<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <radialGradient id="flameInner" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff8d0"/>
      <stop offset="40%" stop-color="#ffd23d"/>
      <stop offset="100%" stop-color="#ff6b3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameBody" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#ff6b3d" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff9a3d"/>
      <stop offset="100%" stop-color="#ffd23d" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <!-- 底部外焰 -->
  <ellipse cx="30" cy="48" rx="16" ry="8" fill="#ff6b3d" opacity="0.4">
    <animate attributeName="rx" values="16;18;16" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.5;0.4" dur="0.5s" repeatCount="indefinite"/>
  </ellipse>
  <!-- 主体焰身 -->
  <path d="M30,55 Q12,35 8,20 Q10,10 20,8 Q26,6 30,5 Q34,6 40,8 Q50,10 52,20 Q48,35 30,55Z" fill="url(#flameBody)">
    <animate attributeName="d" 
      values="M30,55 Q12,35 8,20 Q10,10 20,8 Q26,6 30,5 Q34,6 40,8 Q50,10 52,20 Q48,35 30,55Z;
              M30,55 Q14,33 10,18 Q12,8 22,6 Q27,5 30,4 Q33,5 38,6 Q48,8 50,18 Q46,33 30,55Z;
              M30,55 Q12,35 8,20 Q10,10 20,8 Q26,6 30,5 Q34,6 40,8 Q50,10 52,20 Q48,35 30,55Z"
      dur="0.4s" repeatCount="indefinite"/>
  </path>
  <!-- 内焰 -->
  <path d="M30,48 Q20,32 16,20 Q18,12 25,10 Q28,9 30,8 Q32,9 35,10 Q42,12 44,20 Q40,32 30,48Z" fill="url(#flameInner)">
    <animate attributeName="d"
      values="M30,48 Q20,32 16,20 Q18,12 25,10 Q28,9 30,8 Q32,9 35,10 Q42,12 44,20 Q40,32 30,48Z;
              M30,48 Q22,30 18,18 Q20,10 27,8 Q30,7 30,6 Q30,7 33,8 Q40,10 42,18 Q38,30 30,48Z;
              M30,48 Q20,32 16,20 Q18,12 25,10 Q28,9 30,8 Q32,9 35,10 Q42,12 44,20 Q40,32 30,48Z"
      dur="0.35s" repeatCount="indefinite"/>
  </path>
  <!-- 顶部亮核 -->
  <circle cx="30" cy="10" r="4" fill="#fff8d0" opacity="0.9">
    <animate attributeName="r" values="3;5;3" dur="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="0.3s" repeatCount="indefinite"/>
  </circle>
</svg>
