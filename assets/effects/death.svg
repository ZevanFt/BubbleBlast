<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="deathOuter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4757" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c0392b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deathInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b8a"/>
      <stop offset="100%" stop-color="#ff4757" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 碎裂环 -->
  <circle cx="40" cy="40" r="30" fill="none" stroke="#ff4757" stroke-width="2" opacity="0">
    <animate attributeName="r" values="5;30" dur="0.6s" fill="freeze"/>
    <animate attributeName="opacity" values="0.8;0" dur="0.6s" fill="freeze"/>
    <animate attributeName="stroke-width" values="4;0.5" dur="0.6s" fill="freeze"/>
  </circle>
  <circle cx="40" cy="40" r="30" fill="none" stroke="#ff6b8a" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="8;30" dur="0.5s" fill="freeze" begin="0.1s"/>
    <animate attributeName="opacity" values="0.6;0" dur="0.5s" fill="freeze" begin="0.1s"/>
    <animate attributeName="stroke-width" values="3;0.3" dur="0.5s" fill="freeze" begin="0.1s"/>
  </circle>
  <!-- 膨胀暗影 -->
  <circle cx="40" cy="40" r="10" fill="url(#deathOuter)">
    <animate attributeName="r" values="5;32" dur="0.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" dur="0.5s" fill="freeze"/>
  </circle>
  <!-- 核心闪光 -->
  <circle cx="40" cy="40" r="8" fill="url(#deathInner)">
    <animate attributeName="r" values="2;10" dur="0.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.5" dur="0.2s" fill="freeze"/>
  </circle>
  <!-- 碎片 -->
  <circle cx="40" cy="20" r="2" fill="#ffd23d" opacity="0">
    <animate attributeName="cy" values="40;12" dur="0.45s" fill="freeze" begin="0.1s"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.45s" fill="freeze" begin="0.1s"/>
  </circle>
  <circle cx="55" cy="28" r="1.5" fill="#fff" opacity="0">
    <animate attributeName="cx" values="40;58" dur="0.4s" fill="freeze" begin="0.15s"/>
    <animate attributeName="cy" values="40;22" dur="0.4s" fill="freeze" begin="0.15s"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.4s" fill="freeze" begin="0.15s"/>
  </circle>
  <circle cx="25" cy="25" r="2" fill="#ff9a3d" opacity="0">
    <animate attributeName="cx" values="40;22" dur="0.42s" fill="freeze" begin="0.12s"/>
    <animate attributeName="cy" values="40;18" dur="0.42s" fill="freeze" begin="0.12s"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.42s" fill="freeze" begin="0.12s"/>
  </circle>
  <circle cx="58" cy="50" r="1.5" fill="#ff4757" opacity="0">
    <animate attributeName="cx" values="40;60" dur="0.48s" fill="freeze" begin="0.18s"/>
    <animate attributeName="cy" values="40;52" dur="0.48s" fill="freeze" begin="0.18s"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.48s" fill="freeze" begin="0.18s"/>
  </circle>
  <circle cx="22" cy="55" r="2" fill="#ffd23d" opacity="0">
    <animate attributeName="cx" values="40;18" dur="0.5s" fill="freeze" begin="0.2s"/>
    <animate attributeName="cy" values="40;58" dur="0.5s" fill="freeze" begin="0.2s"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.5s" fill="freeze" begin="0.2s"/>
  </circle>
  <circle cx="35" cy="12" r="1.5" fill="#fff8d0" opacity="0">
    <animate attributeName="cy" values="40;8" dur="0.35s" fill="freeze" begin="0.08s"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.35s" fill="freeze" begin="0.08s"/>
  </circle>
  <circle cx="50" cy="58" r="1.5" fill="#fff" opacity="0">
    <animate attributeName="cx" values="40;52" dur="0.55s" fill="freeze" begin="0.22s"/>
    <animate attributeName="cy" values="40;60" dur="0.55s" fill="freeze" begin="0.22s"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.55s" fill="freeze" begin="0.22s"/>
  </circle>
</svg>
