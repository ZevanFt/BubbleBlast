<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="speedGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#42c6ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#42c6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="speedBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42c6ff"/>
      <stop offset="100%" stop-color="#1a8fd4"/>
    </linearGradient>
    <filter id="speedShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 光晕 -->
  <circle cx="24" cy="24" r="20" fill="url(#speedGlow)"/>
  <!-- 旋风外形 -->
  <g filter="url(#speedShadow)">
    <circle cx="24" cy="24" r="18" fill="url(#speedBody)"/>
    <!-- 旋风尾 -->
    <path d="M24,6 Q30,14 28,22 Q26,18 24,24 Q22,18 20,22 Q18,14 24,6Z" fill="#a8e6ff" opacity="0.7"/>
    <path d="M42,24 Q34,18 26,20 Q22,22 24,24 Q22,26 26,28 Q34,30 42,24Z" fill="#a8e6ff" opacity="0.5"/>
    <!-- 三角箭头 -->
    <polygon points="24,6 28,16 20,16" fill="#fff" opacity="0.9"/>
    <polygon points="42,24 32,28 32,20" fill="#fff" opacity="0.9"/>
    <polygon points="24,42 20,32 28,32" fill="#fff" opacity="0.9"/>
    <polygon points="6,24 16,20 16,28" fill="#fff" opacity="0.9"/>
  </g>
  <!-- 高光 -->
  <circle cx="18" cy="18" r="6" fill="rgba(255,255,255,0.4)"/>
</svg>
