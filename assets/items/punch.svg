<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="punchGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff6b3d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff6b3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="punchBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a3d"/>
      <stop offset="100%" stop-color="#cc4400"/>
    </linearGradient>
    <filter id="punchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 光晕 -->
  <circle cx="24" cy="24" r="18" fill="url(#punchGlow)"/>
  <!-- 拳头 -->
  <circle cx="24" cy="22" r="16" fill="url(#punchBody)" filter="url(#punchShadow)"/>
  <!-- 指节 -->
  <circle cx="18" cy="16" r="5" fill="#cc5500" stroke="#aa3300" stroke-width="0.5"/>
  <circle cx="30" cy="16" r="5" fill="#cc5500" stroke="#aa3300" stroke-width="0.5"/>
  <circle cx="18" cy="28" r="4.5" fill="#cc5500" stroke="#aa3300" stroke-width="0.5"/>
  <circle cx="30" cy="28" r="4.5" fill="#cc5500" stroke="#aa3300" stroke-width="0.5"/>
  <!-- 拳心 -->
  <circle cx="24" cy="23" r="4" fill="#ff6b3d" opacity="0.6"/>
  <!-- 力量线 -->
  <line x1="24" y1="6" x2="24" y2="2" stroke="#ffd23d" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <animate attributeName="y1" values="6;4;6" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="16" y1="4" x2="14" y2="0" stroke="#ffd23d" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="32" y1="4" x2="34" y2="0" stroke="#ffd23d" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <!-- 冲击波 -->
  <circle cx="24" cy="24" r="18" fill="none" stroke="rgba(255,107,61,0.3)" stroke-width="1.5">
    <animate attributeName="r" values="16;24;16" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
