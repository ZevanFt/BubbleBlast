<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="stormGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#78909c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#546e7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stormBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90a4ae"/>
      <stop offset="50%" stop-color="#607d8b"/>
      <stop offset="100%" stop-color="#455a64"/>
    </linearGradient>
    <filter id="stormShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 光晕 -->
  <circle cx="24" cy="24" r="20" fill="url(#stormGlow)"/>
  <!-- 云团主体 -->
  <ellipse cx="24" cy="28" rx="20" ry="14" fill="url(#stormBody)" filter="url(#stormShadow)"/>
  <!-- 云朵层叠 -->
  <ellipse cx="16" cy="24" rx="10" ry="8" fill="#78909c" opacity="0.8"/>
  <ellipse cx="32" cy="24" rx="10" ry="8" fill="#78909c" opacity="0.8"/>
  <ellipse cx="24" cy="20" rx="12" ry="8" fill="#90a4ae" opacity="0.7"/>
  <!-- 闪电 -->
  <path d="M20,12 L22,18 L18,18 L24,28 L20,22 L24,22 Z" fill="#ffe066" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <path d="M26,12 L24,18 L28,18 L22,28 L26,22 L22,22 Z" fill="#ffe066" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <!-- 雨滴 -->
  <line x1="14" y1="38" x2="13" y2="44" stroke="#607d8b" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <animate attributeName="y1" values="38;46;38" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="20" y1="36" x2="19" y2="42" stroke="#607d8b" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <animate attributeName="y1" values="36;44;36" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <line x1="28" y1="38" x2="27" y2="44" stroke="#607d8b" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <animate attributeName="y1" values="38;46;38" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <line x1="34" y1="36" x2="33" y2="42" stroke="#607d8b" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <animate attributeName="y1" values="36;44;36" dur="1.3s" repeatCount="indefinite"/>
  </line>
  <!-- 边框 -->
  <circle cx="24" cy="24" r="17" fill="none" stroke="rgba(120,144,156,0.4)" stroke-width="1"/>
</svg>
