<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="mirrorGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mirrorBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e1f5fe"/>
      <stop offset="50%" stop-color="#b3e5fc"/>
      <stop offset="100%" stop-color="#81d4fa"/>
    </linearGradient>
    <filter id="mirrorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 光晕 -->
  <circle cx="24" cy="24" r="20" fill="url(#mirrorGlow)"/>
  <!-- 镜子主体 -->
  <ellipse cx="24" cy="24" rx="18" ry="14" fill="url(#mirrorBody)" filter="url(#mirrorShadow)"/>
  <!-- 镜面 -->
  <ellipse cx="24" cy="24" rx="14" ry="10" fill="rgba(255,255,255,0.4)"/>
  <ellipse cx="22" cy="22" rx="6" ry="4" fill="rgba(255,255,255,0.6)"/>
  <!-- 边框 -->
  <ellipse cx="24" cy="24" rx="18" ry="14" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.8"/>
  <!-- 反射弧线 -->
  <path d="M10,20 Q14,14 18,16" stroke="#fff" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M30,20 Q26,14 22,16" stroke="#fff" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- 中心点 -->
  <circle cx="24" cy="24" r="3" fill="#4fc3f7" opacity="0.8"/>
  <!-- 反射光线 -->
  <line x1="8" y1="20" x2="6" y2="18" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="40" y1="20" x2="42" y2="18" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>
