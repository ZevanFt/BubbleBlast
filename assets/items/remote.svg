<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="remoteGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3fa65b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3fa65b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="remoteBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5cb86c"/>
      <stop offset="50%" stop-color="#3fa65b"/>
      <stop offset="100%" stop-color="#2d8a3e"/>
    </linearGradient>
    <filter id="remoteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 光晕 -->
  <circle cx="24" cy="24" r="20" fill="url(#remoteGlow)"/>
  <!-- 遥控器机身 -->
  <rect x="12" y="16" width="24" height="18" rx="4" fill="url(#remoteBody)" filter="url(#remoteShadow)"/>
  <!-- 屏幕区域 -->
  <rect x="15" y="19" width="18" height="8" rx="2" fill="#1a2a1a" opacity="0.8"/>
  <!-- 信号波 -->
  <path d="M21,17 Q27,21 21,25" stroke="#7ee87e" stroke-width="1.5" fill="none" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1s" repeatCount="indefinite"/>
  </path>
  <path d="M19,15 Q29,21 19,27" stroke="#7ee87e" stroke-width="1" fill="none" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.3s" repeatCount="indefinite"/>
  </path>
  <!-- 按钮 -->
  <circle cx="24" cy="30" r="4" fill="#ff4757" opacity="0.9"/>
  <circle cx="24" cy="30" r="2" fill="#ff6b7d"/>
  <!-- 方向键 -->
  <rect x="30" y="19" width="4" height="3" rx="1" fill="rgba(255,255,255,0.3)"/>
  <!-- 电池仓 -->
  <rect x="13" y="35" width="6" height="3" rx="1" fill="#333" opacity="0.7"/>
  <rect x="21" y="35" width="6" height="3" rx="1" fill="#333" opacity="0.7"/>
</svg>
