<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="kickGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffd23d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd23d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kickBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c030"/>
      <stop offset="100%" stop-color="#b8863b"/>
    </linearGradient>
    <filter id="kickShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 光晕 -->
  <circle cx="24" cy="24" r="20" fill="url(#kickGlow)"/>
  <!-- 鞋底 -->
  <ellipse cx="24" cy="36" rx="14" ry="8" fill="url(#kickBody)" filter="url(#kickShadow)"/>
  <ellipse cx="24" cy="35" rx="12" ry="5" fill="#f0d050" opacity="0.4"/>
  <!-- 鞋身 -->
  <rect x="10" y="22" width="28" height="12" rx="6" fill="url(#kickBody)" filter="url(#kickShadow)"/>
  <rect x="12" y="23" width="24" height="5" rx="3" fill="rgba(255,255,255,0.2)"/>
  <!-- 鞋带 -->
  <line x1="20" y1="23" x2="20" y2="32" stroke="#8a6a20" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="23" x2="28" y2="32" stroke="#8a6a20" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 弧线轨迹 -->
  <path d="M24,10 Q30,5 36,8" stroke="#ffd23d" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
    <animate attributeName="d" values="M24,10 Q30,5 36,8;M24,10 Q32,4 38,6;M24,10 Q30,5 36,8" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1s" repeatCount="indefinite"/>
  </path>
  <path d="M24,10 Q18,6 12,9" stroke="#ffd23d" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5">
    <animate attributeName="d" values="M24,10 Q18,6 12,9;M24,10 Q16,5 10,7;M24,10 Q18,6 12,9" dur="1.2s" repeatCount="indefinite"/>
  </path>
</svg>
