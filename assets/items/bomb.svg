<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="bombGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffd23d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffd23d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bombBody" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#6b7fa0"/>
      <stop offset="100%" stop-color="#1e2840"/>
    </radialGradient>
    <filter id="bombShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 光晕 -->
  <circle cx="24" cy="24" r="20" fill="url(#bombGlow)"/>
  <!-- 本体 -->
  <circle cx="24" cy="24" r="19" fill="url(#bombBody)" filter="url(#bombShadow)"/>
  <!-- 顶部旋钮 -->
  <rect x="21" y="7" width="6" height="8" rx="3" fill="#c9a050"/>
  <circle cx="24" cy="8" r="3" fill="#e8c87a"/>
  <!-- 引线 -->
  <path d="M24,8 Q28,2 32,0" stroke="#caa06a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 火花 -->
  <circle cx="32" cy="0" r="3.5" fill="#ffd23d">
    <animate attributeName="r" values="3.5;5;3.5" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="0.6s" repeatCount="indefinite"/>
  </circle>
  <!-- 纹路 -->
  <circle cx="24" cy="24" r="10" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="6" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- 字母B -->
  <text x="24" y="28" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="13" font-weight="bold" fill="#fff" opacity="0.9">B</text>
</svg>
