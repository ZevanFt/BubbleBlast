<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="pierceGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e040fb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e040fb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pierceBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="50%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="pierceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 光晕 -->
  <circle cx="24" cy="24" r="20" fill="url(#pierceGlow)"/>
  <!-- 穿透弹主体 -->
  <ellipse cx="24" cy="24" rx="16" ry="10" fill="url(#pierceBody)" filter="url(#pierceShadow)"/>
  <!-- 箭头 -->
  <polygon points="24,6 32,24 24,42 16,24" fill="none" stroke="#b388ff" stroke-width="2" opacity="0.8"/>
  <polygon points="24,8 30,24 24,40 18,24" fill="rgba(179,136,255,0.3)"/>
  <!-- 穿透线条 -->
  <line x1="6" y1="24" x2="42" y2="24" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="10" y1="20" x2="38" y2="20" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="10" y1="28" x2="38" y2="28" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- 核心 -->
  <circle cx="24" cy="24" r="4" fill="#fff" opacity="0.8"/>
  <circle cx="24" cy="24" r="2.5" fill="#e040fb"/>
</svg>
