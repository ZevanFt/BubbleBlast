<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="stoneTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a8599"/>
      <stop offset="100%" stop-color="#6a7589"/>
    </linearGradient>
    <linearGradient id="stoneSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6579"/>
      <stop offset="100%" stop-color="#4a5569"/>
    </linearGradient>
    <filter id="stoneDepth" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 石砖主体 -->
  <rect x="2" y="2" width="44" height="44" rx="7" fill="url(#stoneTop)" filter="url(#stoneDepth)"/>
  <!-- 顶高光 -->
  <rect x="3" y="3" width="42" height="20" rx="6" fill="rgba(255,255,255,0.08)"/>
  <!-- 侧边阴影 -->
  <rect x="2" y="30" width="44" height="16" rx="0 0 7 7" fill="url(#stoneSide)" opacity="0.6"/>
  <!-- 纹理 -->
  <g opacity="0.15" stroke="#fff" stroke-width="0.5">
    <line x1="10" y1="5" x2="10" y2="43"/>
    <line x1="24" y1="5" x2="24" y2="43"/>
    <line x1="38" y1="5" x2="38" y2="43"/>
    <line x1="5" y1="14" x2="43" y2="14"/>
    <line x1="5" y1="30" x2="43" y2="30"/>
  </g>
  <!-- 裂缝装饰 -->
  <g stroke="#3a4559" stroke-width="1" fill="none" opacity="0.4">
    <path d="M18,10 L20,20 L16,30"/>
    <path d="M30,12 L28,24 L32,32"/>
  </g>
</svg>
