<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <radialGradient id="en2Body" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#3fa65b"/>
      <stop offset="100%" stop-color="#2a7a42"/>
    </radialGradient>
    <filter id="en2Shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- 影子 -->
  <ellipse cx="30" cy="50" rx="14" ry="5" fill="rgba(0,0,0,0.2)"/>
  <!-- 身体 -->
  <circle cx="30" cy="28" r="20" fill="url(#en2Body)" filter="url(#en2Shadow)"/>
  <circle cx="30" cy="28" r="20" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <!-- 叶子装饰 -->
  <path d="M15,18 Q20,10 25,16 Q22,12 28,14" fill="#2d8a3e"/>
  <path d="M35,14 Q42,12 45,18 Q40,16 35,18" fill="#2d8a3e"/>
  <!-- 眼睛 -->
  <ellipse cx="22" cy="26" rx="5.5" ry="6.5" fill="#fff"/>
  <circle cx="23" cy="27" r="3" fill="#1a1a2e"/>
  <circle cx="21.5" cy="25.5" r="1.2" fill="#fff"/>
  <ellipse cx="38" cy="26" rx="5.5" ry="6.5" fill="#fff"/>
  <circle cx="39" cy="27" r="3" fill="#1a1a2e"/>
  <circle cx="37.5" cy="25.5" r="1.2" fill="#fff"/>
  <!-- 眼罩 -->
  <path d="M14,22 Q22,18 30,22 Q38,18 46,22 Q42,26 30,28 Q18,26 14,22Z" fill="#1a1a2e" opacity="0.6"/>
  <!-- 腮红 -->
  <ellipse cx="15" cy="33" rx="3.5" ry="2.2" fill="rgba(150,255,150,0.4)"/>
  <ellipse cx="45" cy="33" rx="3.5" ry="2.2" fill="rgba(150,255,150,0.4)"/>
  <!-- 嘴巴（微笑） -->
  <path d="M25,35 Q30,38 35,35" stroke="#1a1a2e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- 手臂 -->
  <circle cx="10" cy="30" r="5.5" fill="#3fa65b"/>
  <circle cx="50" cy="30" r="5.5" fill="#3fa65b"/>
</svg>
