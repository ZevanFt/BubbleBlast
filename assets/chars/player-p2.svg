  <circle cx="30" cy="28" r="20" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <!-- 围巾 -->
  <path d="M12,28 Q18,24 22,26 Q26,20 30,22 Q34,20 38,26 Q42,24 48,28 Q42,32 30,32 Q18,32 12,28Z" fill="#ffd23d" opacity="0.85"/>
