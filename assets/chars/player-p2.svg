  <ellipse cx="15" cy="33" rx="3.5" ry="2.2" fill="rgba(255,120,140,0.5)"/>
  <ellipse cx="45" cy="33" rx="3.5" ry="2.2" fill="rgba(255,120,140,0.5)"/>
